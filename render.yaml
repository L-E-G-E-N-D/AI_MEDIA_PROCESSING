services:
  - type: web
    name: ai-media-api
    env: docker
    region: oregon
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-media-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-media-redis
          property: connectionString
    dockerCommand: npm run start

  - type: worker
    name: ai-media-worker
    env: docker
    region: oregon
    plan: starter
    envVars:
      - key: RUN_WORKER
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-media-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-media-redis
          property: connectionString
    dockerCommand: npm run start

  - type: redis
    name: ai-media-redis
    ipAllowList: []
    plan: free

databases:
  - name: ai-media-db
    region: oregon
    plan: free
    databaseName: mediadb
    user: mediauser
